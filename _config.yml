# WhatATheme
markdown: kramdown

# URL of the Site
url:
# Base URL of the Site (i.e., Name of the Repository in which the Site is hosted)
baseurl:

# Title of the Site
title: Git weslab website
# Description of the Site
description: My Test Website on weslab
# URL of Image of the Site
site-image: /WhatATheme/assets/images/meta.jpg
# Keywords of the Site
site-keywords: Site, Template, Theme
# URL for the Image of custom Favicon
favicon-url:

# URL of the Image of Custom Hero Image (i.e., the image in the background of the very first section of the Homepage)
heroimage: https://images.pexels.com/photos/220444/pexels-photo-220444.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940

# Social Media and Contact
# If you don't want to use any icon, you can leave them blank.
email:
facebook_username:
twitter_username:
instagram_username:
linkedin_username: wvsandwijk
github_username: wvsandwijk
youtube_channel_id:
reddit_username: Red_7107
behance_username:
dribbble_username:
spotify_username: wvsandwijk
twitch_username: wvsandwijk

# Google Analytics
google-analytics:

# Disqus
disqus-shortname:

# Name of the Author
author-name: WvSandwijk
# URL for the Image of the Author
author-image: https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png
# 60 Words About the Author
author-about: >
  I have been working as a software engineer for over 10 years.<br>
  I have experience in various programming languages and frameworks, and I enjoy learning new technologies and improving my skills.<br>
  In my free time, I like to contribute to open source projects and write technical articles on my blog.<br>
  I have built this website to showcase my work and share my knowledge with the community.<br><br>
  I hope you find it useful and informative.
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: https://github.com/wvsandwijk

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
# plugins:
#   - jekyll-admin
#   - jekyll-feed

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
